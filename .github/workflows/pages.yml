# Deploys the landing page to GitHub Pages (static SPA build).
#
# Prerequisite (one-time, repo settings): Pages source = "GitHub Actions".
#
# The base path is the project page URL (/soiquit/). With a custom
# domain, set NUXT_APP_BASE_URL=/ in this file (or in a repo variable).
name: Deploy Landing to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /soiquit/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
